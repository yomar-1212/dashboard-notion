<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobbies — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFCFF;--bg2:#EEF4FF;--bg3:#DCE9FF;
  --text:#1a1f36;--text2:#3d5166;--text3:#8aa0b8;
  --border:rgba(2,136,209,0.12);--border2:rgba(2,136,209,0.25);
  --r:8px;--rl:14px;
  --blue:#0288D1;--blue-bg:#E1F5FE;--blue-dk:#01579B;--blue-lt:#29B6F6;
  --navy:#01579B;--navy-bg:#E3F2FD;--navy-dk:#003c6e;
  --orange:#FF6D00;--orange-bg:#FFF3E0;--orange-dk:#E65100;--orange-lt:#FF9100;
  --amber:#FFB300;--amber-bg:#FFF8E1;--amber-dk:#FF6F00;
  --green:#00897B;--green-bg:#E0F2F1;--green-dk:#004D40;
  --red:#E53935;--red-bg:#FFEBEE;--red-dk:#B71C1C;
  --gold:#FF8F00;--gold-bg:#FFF8E1;--gold-dk:#E65100;
  --purple:#5E35B1;--purple-bg:#EDE7F6;--purple-dk:#311B92;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Jost',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.shell{max-width:100%;margin:0 auto;padding:0 40px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;border-bottom:2px solid var(--border2);margin-bottom:22px;flex-wrap:wrap;gap:12px}
.back-link{font-size:11px;color:var(--text2);text-decoration:none;letter-spacing:.5px}.back-link:hover{color:var(--orange)}
.app-title{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--text);text-align:center}
.app-sub{font-size:11px;color:var(--text2);letter-spacing:.4px;text-align:center;margin-top:3px}
.nav{display:flex;border-bottom:2px solid var(--border2);margin-bottom:26px;overflow-x:auto;scrollbar-width:none;gap:2px}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:10px 18px;border:none;background:none;font-size:12px;font-family:var(--sans);color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;border-radius:var(--r) var(--r) 0 0;transition:all .15s}
.nav-btn:hover{color:var(--orange);background:var(--orange-bg)}
.nav-btn.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:600;background:var(--orange-bg)}
.page{display:none}.page.on{display:block}
.card{background:var(--bg);border:1px solid var(--border2);border-radius:var(--rl);padding:22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(2,136,209,.05)}
.card-title{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--bg);border:1px solid var(--border2);border-radius:var(--rl);padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-c,var(--orange))}
.kpi-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;font-weight:600}
.kpi-val{font-family:var(--serif);font-size:22px;font-weight:700}
.f input,.f select,.f textarea{height:38px;border:1.5px solid var(--border2);border-radius:var(--r);padding:0 12px;font-size:12px;font-family:var(--sans);background:var(--bg);color:var(--text);transition:border-color .2s}
.btn-save{padding:10px 22px;border:none;border-radius:var(--r);font-size:12px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:opacity .2s,transform .1s}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.xbtn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:3px 7px;border-radius:5px}
.empty{text-align:center;padding:44px 20px;color:var(--text3);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:.4;display:block}
.prog{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease}
.hobby-main-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.hobby-card{background:var(--bg);border:1.5px solid var(--border2);border-radius:var(--rl);padding:18px;position:relative;overflow:hidden}
.hobby-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--hc,var(--orange))}
.hobby-emoji{font-size:32px;margin-bottom:10px;display:block}
.hobby-name{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:4px;color:var(--text)}
.hobby-cat{font-size:10px;color:var(--text2);margin-bottom:10px}
.hobby-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.h-stat-val{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text)}
.h-stat-label{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:2px}
.racha-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--orange-bg);color:var(--orange-dk);margin-bottom:8px}
.sync-status { font-size: 11px; color: var(--text3); display: inline-flex; align-items: center; gap: 5px; font-weight: 500;}
.sync-status.saving { color: var(--amber-dk); }
.sync-status.success { color: var(--green); }
.sync-status.error { color: var(--red); }
</style>
</head>
<body>
<div class="shell">
<div class="topbar">
  <a class="back-link" href="hub.html">← Hub</a>
  <div>
    <div class="app-title">🌿 Hobbies</div>
    <div class="app-sub" id="cur-date"></div>
  </div>
  <div id="sync-indicator" class="sync-status">☁️ Conectado local</div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="goPage('dashboard',this)">Dashboard</button>
  <button class="nav-btn" onclick="goPage('hobbies',this)">Mis Hobbies</button>
  <button class="nav-btn" onclick="goPage('registro',this)">Registrar Sesión</button>
  <button class="nav-btn" onclick="goPage('stats',this)">Estadísticas</button>
</div>
 
<div id="page-dashboard" class="page on"><div class="kpi-row" id="dash-kpi"></div><div class="grid2"><div class="card"><div class="card-title">🔥 Rachas activas</div><div id="dash-rachas"></div></div><div class="card"><div class="card-title">📅 Esta semana</div><div id="dash-semana"></div></div></div><div class="card"><div class="card-title">🗓 Últimas sesiones</div><div id="dash-recent"></div></div></div>
 
<div id="page-hobbies" class="page">
  <div class="card">
    <div class="card-title">Agregar Hobby</div>
    <div class="fg">
      <div class="f"><div class="fl">Nombre</div><input type="text" id="hb-nombre" placeholder="Ej: Leer, Pintar..."></div>
      <div class="f"><div class="fl">Emoji</div><input type="text" id="hb-emoji" placeholder="🎸" maxlength="2"></div>
      <div class="f"><div class="fl">Categoría</div><select id="hb-cat"><option>🎨 Arte</option><option>🎵 Música</option><option>📚 Aprendizaje</option></select></div>
      <div class="f"><div class="fl">Frecuencia</div><select id="hb-freq"><option value="diario">Diario</option><option value="semanal">Semanal</option></select></div>
      <div class="f"><div class="fl">Duración (min)</div><input type="number" id="hb-duracion" placeholder="60"></div>
    </div>
    <div class="btn-row"><button class="btn-save orange" onclick="addHobby()">+ Agregar hobby</button></div>
  </div>
  <div class="hobby-main-grid" id="hobbies-grid"></div>
</div>
 
<div id="page-registro" class="page">
  <div class="card">
    <div class="card-title">Registrar Sesión</div>
    <div class="fg">
      <div class="f"><div class="fl">Hobby</div><select id="reg-hobby"><option value="">-- Seleccionar --</option></select></div>
      <div class="f"><div class="fl">Fecha</div><input type="date" id="reg-fecha"></div>
      <div class="f"><div class="fl">Duración (min)</div><input type="number" id="reg-dur" placeholder="60"></div>
      <div class="f"><div class="fl">Mood</div><select id="reg-mood"><option value="5">😄</option><option value="3">😐</option><option value="1">😔</option></select></div>
      <div class="f wide"><div class="fl">Notas</div><textarea id="reg-notas"></textarea></div>
    </div>
    <div class="btn-row"><button class="btn-save green" onclick="addSesion()">+ Guardar sesión</button></div>
  </div>
  <div class="card"><div class="card-title">Historial</div><div id="sesiones-list"></div></div>
</div>

<div id="page-stats" class="page"><div class="kpi-row" id="stats-kpi"></div><div class="card"><div class="card-title">Tiempo total</div><div id="stats-by-hobby"></div></div></div>

<script>
const GH_TOKEN = "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";
const GH_OWNER = "yomar-1212";
const GH_REPO = "dashboard-notion";
const GH_PATH = "data/hobbies.json";
const NOTION_TOKEN = "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";
const NOTION_DB_ID = "37b51ab88da68055bc37e683168c1933";
const CORS_PROXY = "https://cors-anywhere.herokuapp.com/"; 

let hobbies=JSON.parse(localStorage.getItem('ho_hb')||'[]'), sesiones=JSON.parse(localStorage.getItem('ho_se')||'[]');

async function saveToGitHub() {
  const ind = document.getElementById('sync-indicator');
  ind.textContent = "⏳ Sincronizando..."; ind.className = "sync-status saving";
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  try {
    const res = await fetch(url, { headers: { 'Authorization': `token ${GH_TOKEN}` } });
    const sha = res.ok ? (await res.json()).sha : null;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({hobbies, sesiones}))));
    await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: "Auto-save", content, sha })
    });
    ind.textContent = "☁️ Sincronizado"; ind.className = "sync-status success";
  } catch(e) { ind.textContent = "❌ Error GitHub"; ind.className = "sync-status error"; }
}

async function saveToNotion(hName, emoji, sesion) {
  try {
    await fetch(`${CORS_PROXY}https://api.notion.com/v1/pages`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${NOTION_TOKEN}`, 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        parent: { database_id: NOTION_DB_ID },
        properties: { "Hobby": { title: [{ text: { content: hName } }] }, "Fecha": { date: { start: sesion.fecha } }, "Duración (min)": { number: parseInt(sesion.dur) }, "Mood": { number: parseInt(sesion.mood) } }
      })
    });
  } catch(e) { console.error(e); }
}

function persist(){ localStorage.setItem('ho_hb',JSON.stringify(hobbies)); localStorage.setItem('ho_se',JSON.stringify(sesiones)); saveToGitHub(); }
function addHobby(){ hobbies.push({id:Date.now(), nombre:document.getElementById('hb-nombre').value, emoji:document.getElementById('hb-emoji').value, cat:document.getElementById('hb-cat').value, freq:document.getElementById('hb-freq').value, duracion:parseInt(document.getElementById('hb-duracion').value)}); persist(); renderHobbies(); }
function addSesion(){ 
  const hId = parseInt(document.getElementById('reg-hobby').value);
  const ses = {id:Date.now(), hobbyId:hId, fecha:document.getElementById('reg-fecha').value, dur:parseInt(document.getElementById('reg-dur').value), mood:parseInt(document.getElementById('reg-mood').value), notas:document.getElementById('reg-notas').value};
  sesiones.push(ses); persist(); saveToNotion(hobbies.find(h=>h.id===hId).nombre, hobbies.find(h=>h.id===hId).emoji, ses); renderRegistro();
}
function goPage(id,btn){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('on')); document.getElementById('page-'+id).classList.add('on'); }

// Init
document.getElementById('reg-fecha').value = new Date().toISOString().slice(0,10);
renderHobbies(); renderRegistro();
</script>
</body>
</html>
